name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run irrelevant, but a running job on the same
# branch is left alone so its result is still published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the project asks for in package.json engines.
          node-version: "22"
          cache: npm

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # The build prerenders every route, so it is the check that catches a
        # page that renders on the server and then breaks in the browser. The
        # placeholder values are never contacted: nothing in the build reaches
        # Supabase.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
